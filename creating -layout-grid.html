<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    *{
        font-family: TondoBold, sans-serif;
    }
    .container{
        border: 1px solid gray;
        
    }
    .item-1{
        margin: 2px;
        padding: 5px;
        border-bottom: 0.5px solid rgb(156, 156, 164);
        border-top: 0.5px solid rgb(90, 90, 99);
        display: flex;
        justify-content: space-between;
        font-size: 10px; 
        font-weight: bold;
    }
     .div1 {

        display: flex;
        gap: 30px;
    }
    .div1 a{
        text-decoration: none;
    }
    .div2 a{
        text-decoration: none;
        font-size:14px ;
        color: red;
        font-weight: 500;
        
    }
   
    .item-2{
        margin: 2px;
        padding: 5px;
        border-bottom: 0.5px solid rgb(139, 139, 142);
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-size: 14px;  
    }
    .navbar{
        display: flex;
        gap: 80px;
        
    }
    .navbar a{
        text-decoration: none;
    }
    .login{
        display: flex;
        align-items: center;
    }
    .login a{
        text-decoration: none;
    }
   .user{
    margin-top: 5px;
   }
   a::hover{
    /* cursor: pointer; */
    color: red;
    
   }
   img::hover{
    background-color: red;
   }
   .item3{
    border: 1px solid blue;
    padding: 5px;
    margin: 2px;
   }
   .item-11{
    margin-top: 30px;
    font-size: 30px;
    text-align: center;
   }
  .item-22{
    border: 1px solid gray;
    display: grid;
    grid-template-columns: repeat(3,1fr);
  }
  .card1{
    width: 300px;
  }
  .button{
    margin-top: 30px;
    margin-left: 10px;
    display: flex;
    gap: 15px;

  }
  .button .b1{
    background-color: black;
    color: white;
    border-radius: 5px;
    border-style: none;
    width: 100px;
    padding: 5px;
    margin-bottom: 10px;
  }
  .tag{
     text-decoration: none;
     color: red;
     font-size: 10px;
     font-weight: bold;
  }
  figcaption{
    color: red;
    font-size: 12px;
    font-weight: 700;
    margin-left: 8px;
  }
  .grandchild{
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid red;
  }
  p{
    margin-left: 8px;
  }
  .p2{
    font-size: 12px;
    color: gray;
  }

     



    </style>
   
</head>
<body>
    <section class="container">
        <div class="item-1">
            
                <div class="div1">
                   
                     <a href="">INDIVIDUAL</a>
                     <a href="">BUSINESS</a>
                     <a href="">INVESTOR</a>
                
                </div>
                <div class="div2">
                    <a href="">Explore Airtel</a>
                </div>
        
        </div>
        <div class="item-2">
            <div class="logo">
                <a href="">
                    <img src="./airtel1.jpg" width="100px"     alt="airtelimage" >

                </a>
            </div>
            <nav class="navbar">
                
                        <a href="">Airtel Black</a>
                    
                        <a href="">Prepaid</a>
                    
                        <a href="">Postpaid</a>
                    
                        <a href="">Wi-Fi</a>
                        <a href="">DTH</a>
                    
                        <a href="">Bank </a>
                        <a href="">Airtel Finance</a>
                   
            
            </nav>
            <div class="login">
                <a href="">
                    <img class="user"
                    src="./profile.avif" width="20px" alt="userprofile">
                   
                </a>
                <a href="">Account</a>

            </div>

        </div>
        <div class="item3">
         <div class="item-11">Recommended for you</div>
         <div class="item-22">
            <figure class="grandchild">
                <img class="card1"
                src="./images/recommendations-slide-1.jpg" alt="">
                <figcaption>FIBER</figcaption>
                <p>Enjoy unlimited wi-fi <br> at ₹999</p> 
                <p class="p2">Up to 200 Mbps speed, unlimited calls & OTT apps</p>
                <div class="button">
                    <a href="">
                    <button class="b1">BUY NOW</button>
                    </a>
                    <a class="tag" href="">
                        LEARN MORE
                        </a>
                    <a href=""></a>
                </div>
            </figure>
            <figure class="grandchild">
                <img class="card1" src="./images/recommendations-slide-2.webp" alt="">
                <figcaption>POSTPAID</figcaption>
                <p>Get a superior network at <br>just ₹549</p>
                <p class="p2"> 75 GB data with no daily limit & top OTT apps</p>
                <div class="button">
                    <a href="">
                    <button class="b1">BUY NOW</button>
                    </a>
                    <a class="tag" href="">
                        LEARN MORE
                    </a>
                    <a href=""></a>
                </div>
            </figure>
            <figure class="grandchild">
                <img class="card1" src="./images/recommendations-slide-3.jpg" alt="">
                <figcaption>PREPAID</figcaption>
                <p>Enjoy high-speed, <br> seamless network</p> 
                <p class="p2">Home delivery of SIM & Quick activation</p>
                <div class="button">
                    <a href="">
                    <button class="b1">BUY NOW</button>
                    </a>
                    <a class="tag" href="">
                        LEARN MORE
                        </a>
                     <a href=""></a>   
                </div>
            </div>
            </figure>
        </div>
    </section>
</body>
</html>
